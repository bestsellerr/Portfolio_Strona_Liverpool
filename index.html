<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Statystyki meczów Liverpoolu 25/26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="images/liverpool_logo.png" alt="Liverpool" class="logo">
    <h1>🔴 Statystyki meczów Liverpoolu w Premier League w sezonie 2025/26</h1>
</header>


<div class="stats" id="stats-panel">
    <!-- Statystyki wypełnią się dynamicznie JS -->
</div>

<table>
    <thead>
        <tr>
            <th data-sort="date">Data</th>
            <th data-sort="opponent">Przeciwnik</th>
            <th data-sort="score">Wynik</th>
            <th data-sort="goalsFor">Strzelone</th>
            <th data-sort="goalsAgainst">Stracone</th>
            <th data-sort="result">Rezultat</th>
        </tr>
    </thead>
    <tbody id="matches-table"></tbody>
</table>

<footer>
    <p>
        GitHub: <a href="https://github.com/bestsellerr" target="_blank">bestsellerr</a> | 
        Kontakt: <a href="mailto:mikolajselerski@gmail.com">mikolajselerski@gmail.com</a>
    </p>
</footer>

<script src="app.js"></script>
</body>
</html>
